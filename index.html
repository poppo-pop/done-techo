<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FAF6F0">
  <title>やったこと手帳</title>
  <style>
    :root {
      --bg-paper: #FAF6F0;
      --bg-paper-sub: #F2EBE0;
      --grid-line: rgba(133, 122, 110, 0.14);
      --card-bg: #FFFDF9;
      --ink: #3D352E;
      --ink-muted: #857A6E;
      --border-soft: #E6DEC8;
      --terracotta: #C86D51;
      --terracotta-soft: #FCECE8;
      --sage: #6B8E78;
      --sage-soft: #EAF3EE;
      --mustard: #D4A359;
      --mustard-soft: #FBF4E1;
      --lavender: #9B89B3;
      --lavender-soft: #F1EDF6;
      --sky: #7EA8BE;
      --sky-soft: #EAF2F6;
      --shadow-card: 0 3px 10px rgba(61, 53, 46, 0.06);
      --shadow-fab: 0 6px 18px rgba(200, 109, 81, 0.38);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      font-family: 'Hiragino Maru Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
      color: var(--ink);
      background-color: var(--bg-paper);
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 20px 20px;
      min-height: 100vh;
    }

    body {
      padding-bottom: 104px;
    }

    /* ヘッダー */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(250, 246, 240, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1.5px dashed var(--border-soft);
      padding: 14px 16px 12px;
    }

    .header-inner {
      max-width: 600px;
      margin: 0 auto;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--terracotta);
      color: #FFFDF9;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(200, 109, 81, 0.3);
      flex-shrink: 0;
    }

    .brand-text h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    .today-label {
      margin: 2px 0 0;
      font-size: 0.75rem;
      color: var(--ink-muted);
      font-weight: 600;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1.5px solid var(--border-soft);
      background: var(--card-bg);
      color: var(--ink-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.15s ease;
      flex-shrink: 0;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    /* カテゴリフィルタータブ */
    .filter-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 12px;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .filter-scroll::-webkit-scrollbar {
      display: none;
    }

    .filter-pill {
      flex-shrink: 0;
      padding: 7px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border-soft);
      background: var(--card-bg);
      color: var(--ink-muted);
      font-size: 0.8rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-pill.active {
      background: var(--ink);
      color: #FFFDF9;
      border-color: var(--ink);
    }

    /* メインコンテンツ */
    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 14px 16px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
    }

    .count-text {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--ink-muted);
    }

    .sort-select {
      background: var(--card-bg);
      border: 1.5px solid var(--border-soft);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--ink);
      font-family: inherit;
      outline: none;
    }

    /* タスクカード */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-soft);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: flex-start;
      gap: 13px;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .task-card.is-today {
      border-color: rgba(107, 142, 120, 0.55);
      background: #FCFDFB;
    }

    /* タクタイル円形チェックボタン (44px x 44px) */
    .check-btn {
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      border-radius: 50%;
      border: 2px solid #D5CBB8;
      background: var(--bg-paper);
      color: #B8AE9E;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      margin-top: 2px;
      transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.15s ease;
    }

    .check-btn:active {
      transform: scale(0.88);
    }

    .check-btn.checked {
      background: var(--sage);
      border-color: var(--sage);
      color: #FFFFFF;
      box-shadow: 0 3px 10px rgba(107, 142, 120, 0.38);
    }

    @keyframes stampPop {
      0% { transform: scale(1.32) rotate(-10deg); }
      60% { transform: scale(0.92) rotate(3deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .stamp-anim {
      animation: stampPop 0.34s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* カード中央・右エリア */
    .card-content {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .card-top-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    /* カテゴリ付箋バッジ */
    .cat-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 7px;
      font-size: 0.72rem;
      font-weight: 800;
      border: 1px solid transparent;
    }

    .cat-terracotta { background: var(--terracotta-soft); color: #A64E35; border-color: #F2C8BD; }
    .cat-sage       { background: var(--sage-soft); color: #436951; border-color: #C4DEC9; }
    .cat-mustard    { background: var(--mustard-soft); color: #8A641E; border-color: #EED99E; }
    .cat-lavender   { background: var(--lavender-soft); color: #6B5982; border-color: #D7CCE3; }
    .cat-sky        { background: var(--sky-soft); color: #4B758A; border-color: #C2D9E5; }

    /* 経過日数バッジ */
    .elapsed-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 0.74rem;
      font-weight: 800;
    }

    .badge-none {
      background: var(--bg-paper-sub);
      color: var(--ink-muted);
    }

    .badge-today {
      background: var(--sage);
      color: #FFFFFF;
    }

    .badge-yesterday {
      background: var(--mustard-soft);
      color: #8A641E;
      border: 1px solid #EED99E;
    }

    .badge-days {
      background: var(--terracotta-soft);
      color: #A64E35;
      border: 1px solid #F2C8BD;
    }

    .card-title {
      margin: 0 0 6px;
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.4;
      word-break: break-word;
    }

    .card-bottom-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .last-done-text {
      font-size: 0.74rem;
      color: var(--ink-muted);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .memo-box {
      background: var(--bg-paper);
      border-left: 3px solid var(--mustard);
      border-radius: 0 8px 8px 0;
      padding: 6px 10px;
      font-size: 0.79rem;
      color: var(--ink-muted);
      line-height: 1.45;
      word-break: break-word;
    }

    .empty-box {
      text-align: center;
      padding: 44px 20px;
      background: var(--card-bg);
      border: 1.5px dashed var(--border-soft);
      border-radius: 18px;
      color: var(--ink-muted);
    }

    /* 右下フローティングボタン */
    .fab-btn {
      position: fixed;
      right: 20px;
      bottom: 24px;
      width: 58px;
      height: 58px;
      border-radius: 18px;
      border: none;
      background: var(--terracotta);
      color: #FFFDF9;
      box-shadow: var(--shadow-fab);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 30;
      transition: transform 0.14s ease;
    }

    .fab-btn:active {
      transform: scale(0.92);
    }

    /* トースト通知（控えめな角丸 10px） */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 94px;
      transform: translateX(-50%) translateY(14px);
      background: var(--ink);
      color: #FFFDF9;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 253, 249, 0.14);
      font-size: 0.82rem;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(61, 53, 46, 0.24);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 40;
      max-width: 90vw;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    /* モーダル */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(61, 53, 46, 0.45);
      backdrop-filter: blur(3px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
      padding: 12px;
    }

    @media (min-width: 520px) {
      .modal-backdrop {
        align-items: center;
      }
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1.5px solid var(--border-soft);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 14px 36px rgba(61, 53, 46, 0.22);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 1.5px dashed var(--border-soft);
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--ink);
    }

    .form-input, .form-textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1.5px solid var(--border-soft);
      background: var(--bg-paper);
      color: var(--ink);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: var(--terracotta);
      background: #FFFFFF;
    }

    /* モーダル内カテゴリピル選択 */
    .cat-selector-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .cat-choice-pill {
      padding: 7px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--border-soft);
      background: var(--bg-paper);
      color: var(--ink-muted);
      font-size: 0.8rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
    }

    .cat-choice-pill.selected {
      border-color: var(--ink);
      box-shadow: 0 2px 6px rgba(61, 53, 46, 0.12);
    }

    .new-cat-panel {
      margin-top: 10px;
      padding: 12px;
      background: var(--bg-paper);
      border: 1.5px dashed var(--border-soft);
      border-radius: 14px;
      display: none;
    }

    .new-cat-panel.open {
      display: block;
    }

    .color-picker-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
    }

    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 2.5px solid transparent;
      cursor: pointer;
      padding: 0;
    }

    .color-swatch.selected {
      border-color: var(--ink);
      transform: scale(1.1);
    }

    .quick-date-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-size: 0.88rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: var(--terracotta);
      color: #FFFDF9;
      flex: 1;
    }

    .btn-secondary {
      background: var(--bg-paper-sub);
      color: var(--ink);
    }

    .btn-danger {
      background: #FDECEB;
      color: #C43D33;
    }

    .btn-xs {
      padding: 6px 10px;
      font-size: 0.76rem;
      border-radius: 9px;
    }

    .modal-footer-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <div class="header-inner">
      <div class="header-top">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              <polyline points="9 11 11.5 13.5 16 9"></polyline>
            </svg>
          </div>
          <div class="brand-text">
            <h1>やったこと手帳</h1>
            <p class="today-label" id="header-today-date"></p>
          </div>
        </div>
        <button type="button" class="icon-btn" id="open-backup-btn" aria-label="バックアップと設定">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>

      <!-- カテゴリフィルターピル -->
      <div class="filter-scroll" id="category-filter-bar"></div>
    </div>
  </header>

  <!-- メインリスト -->
  <main>
    <div class="toolbar">
      <span class="count-text" id="task-count-label">0件の記録</span>
      <select class="sort-select" id="sort-select" aria-label="並び替え">
        <option value="elapsed_desc">経過日数が長い順</option>
        <option value="recent_desc">最近やった順</option>
        <option value="created_desc">登録順</option>
      </select>
    </div>

    <div class="task-list" id="task-list"></div>
  </main>

  <!-- 右下追加ボタン -->
  <button type="button" class="fab-btn" id="open-add-modal-btn" aria-label="新しいやったことを追加">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
  </button>

  <!-- トースト通知 -->
  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toast-message"></span>
  </div>

  <!-- 追加・編集モーダル -->
  <div class="modal-backdrop" id="task-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="task-modal-title">新しい項目を追加</h2>
        <button type="button" class="icon-btn" id="close-task-modal-btn" aria-label="閉じる">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <form id="task-form">
        <input type="hidden" id="form-task-id">

        <div class="form-group">
          <label class="form-label" for="form-title">やったこと（タスク名）*</label>
          <input type="text" id="form-title" class="form-input" placeholder="例：シーツ・枕カバーの洗濯" required>
        </div>

        <div class="form-group">
          <label class="form-label">カテゴリ</label>
          <div class="cat-selector-wrap" id="modal-category-pills"></div>

          <div class="new-cat-panel" id="new-cat-panel">
            <input type="text" id="new-cat-name-input" class="form-input" placeholder="新しいカテゴリ名（例：自分時間）" style="padding:8px 10px; font-size:0.86rem;">
            <div class="color-picker-row" id="new-cat-colors">
              <button type="button" class="color-swatch selected" data-color="terracotta" style="background:#C86D51;" aria-label="テラコッタ"></button>
              <button type="button" class="color-swatch" data-color="sage" style="background:#6B8E78;" aria-label="セージグリーン"></button>
              <button type="button" class="color-swatch" data-color="mustard" style="background:#D4A359;" aria-label="マスタード"></button>
              <button type="button" class="color-swatch" data-color="lavender" style="background:#9B89B3;" aria-label="ラベンダー"></button>
              <button type="button" class="color-swatch" data-color="sky" style="background:#7EA8BE;" aria-label="スカイ"></button>
            </div>
            <button type="button" class="btn btn-secondary btn-xs" id="confirm-add-cat-btn">カテゴリを追加する</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="form-done-at">完了した日時</label>
          <input type="datetime-local" id="form-done-at" class="form-input">
          <div class="quick-date-btns">
            <button type="button" class="btn btn-secondary btn-xs" id="quick-now-btn">今すぐやったことにする</button>
            <button type="button" class="btn btn-secondary btn-xs" id="quick-clear-btn">未完了にする（記録を消す）</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="form-memo">一言メモ</label>
          <textarea id="form-memo" class="form-textarea" rows="2" placeholder="例：柔軟剤を変えたらすごく良い香り！"></textarea>
        </div>

        <div class="modal-footer-actions">
          <button type="button" class="btn btn-danger" id="delete-task-btn" style="display:none;">削除</button>
          <button type="submit" class="btn btn-primary">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- バックアップ・データ管理モーダル -->
  <div class="modal-backdrop" id="backup-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2>データのバックアップ・管理</h2>
        <button type="button" class="icon-btn" id="close-backup-modal-btn" aria-label="閉じる">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <p style="font-size:0.83rem; color:var(--ink-muted); line-height:1.55; margin-top:0;">
        すべての記録はこのスマホのブラウザ内に自動保存されています。機種変更や万が一のデータ消去に備えて、JSONファイルとして書き出し・復元ができます。
      </p>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <button type="button" class="btn btn-secondary" id="export-json-btn">バックアップを書き出す（JSON）</button>
        <label class="btn btn-secondary" style="cursor:pointer;">
          バックアップを読み込む（復元）
          <input type="file" id="import-json-input" accept=".json" style="display:none;">
        </label>
        <button type="button" class="btn btn-danger" id="reset-sample-btn" style="margin-top:8px;">サンプルデータに戻す</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = 'yattakoto_techo_v1';

      const DEFAULT_CATEGORIES = [
        { id: 'cat_house', name: '家事', color: 'terracotta' },
        { id: 'cat_study', name: '勉強', color: 'sky' },
        { id: 'cat_child', name: '育児', color: 'mustard' },
        { id: 'cat_care',  name: 'ケア・健康', color: 'sage' }
      ];

      function buildInitialSampleTasks() {
        const now = new Date();
        const makePastIso = (daysAgo, hour, minute) => {
          const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysAgo, hour, minute, 0);
          return d.toISOString();
        };
        return [
          {
            id: 'sample_1',
            title: 'シーツ・枕カバーの洗濯',
            categoryId: 'cat_house',
            lastDoneAt: makePastIso(6, 9, 30),
            previousDoneAt: makePastIso(13, 10, 0),
            memo: 'お日さまが出ていたのでベランダでカラッと乾燥！',
            createdAt: makePastIso(20, 9, 0)
          },
          {
            id: 'sample_2',
            title: 'Pythonの基礎復習',
            categoryId: 'cat_study',
            lastDoneAt: makePastIso(1, 21, 15),
            previousDoneAt: makePastIso(5, 22, 0),
            memo: 'リストと辞書の使い分けをノートにまとめた',
            createdAt: makePastIso(15, 20, 0)
          },
          {
            id: 'sample_3',
            title: 'エアコンのフィルター掃除',
            categoryId: 'cat_house',
            lastDoneAt: makePastIso(18, 14, 20),
            previousDoneAt: null,
            memo: '掃除機でホコリを吸ってから水洗いした',
            createdAt: makePastIso(18, 14, 0)
          },
          {
            id: 'sample_4',
            title: 'お気に入りの紅茶でひと息',
            categoryId: 'cat_care',
            lastDoneAt: makePastIso(0, 15, 0),
            previousDoneAt: makePastIso(2, 15, 30),
            memo: 'アールグレイに少しミルクを入れてリラックス',
            createdAt: makePastIso(10, 15, 0)
          }
        ];
      }

      const state = {
        categories: [],
        tasks: [],
        activeFilter: 'all',
        sortBy: 'elapsed_desc',
        modalSelectedCategoryId: 'cat_house',
        newCatColor: 'terracotta',
        lastStampedTaskId: null
      };

      // --- ストレージ管理 ---
      function loadFromStorage() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            state.categories = Array.isArray(parsed.categories) && parsed.categories.length > 0
              ? parsed.categories
              : DEFAULT_CATEGORIES.slice();
            state.tasks = Array.isArray(parsed.tasks) ? parsed.tasks : [];
            return;
          }
        } catch (err) {
          // 読み込み失敗時は初期データへフォールバック
        }
        state.categories = DEFAULT_CATEGORIES.slice();
        state.tasks = buildInitialSampleTasks();
        saveToStorage();
      }

      function saveToStorage() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            categories: state.categories,
            tasks: state.tasks
          }));
        } catch (err) {
          showToast('データの保存に失敗しました');
        }
      }

      // --- 日付ユーティリティ ---
      function renderTodayHeader() {
        const now = new Date();
        const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
        const y = now.getFullYear();
        const m = now.getMonth() + 1;
        const d = now.getDate();
        const w = weekdays[now.getDay()];
        document.getElementById('header-today-date').textContent = `${y}年${m}月${d}日（${w}）`;
      }

      function getElapsedDays(isoString) {
        if (!isoString) return null;
        const target = new Date(isoString);
        if (isNaN(target.getTime())) return null;
        const now = new Date();
        const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const targetMidnight = new Date(target.getFullYear(), target.getMonth(), target.getDate());
        const diffMs = todayMidnight.getTime() - targetMidnight.getTime();
        return Math.floor(diffMs / (1000 * 60 * 60 * 24));
      }

      function formatDateTime(isoString) {
        if (!isoString) return '未完了';
        const d = new Date(isoString);
        if (isNaN(d.getTime())) return '未完了';
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        return `最終: ${y}/${m}/${day} ${hh}:${mm}`;
      }

      function toDatetimeLocalString(isoString) {
        const d = isoString ? new Date(isoString) : new Date();
        if (isNaN(d.getTime())) return '';
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        return `${y}-${m}-${day}T${hh}:${mm}`;
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // --- 描画処理 ---
      function renderCategoryFilters() {
        const bar = document.getElementById('category-filter-bar');
        bar.innerHTML = '';

        const allBtn = document.createElement('button');
        allBtn.type = 'button';
        allBtn.className = 'filter-pill' + (state.activeFilter === 'all' ? ' active' : '');
        allBtn.textContent = 'すべて';
        allBtn.addEventListener('click', () => {
          state.activeFilter = 'all';
          renderApp();
        });
        bar.appendChild(allBtn);

        state.categories.forEach((cat) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'filter-pill' + (state.activeFilter === cat.id ? ' active' : '');
          btn.textContent = cat.name;
          btn.addEventListener('click', () => {
            state.activeFilter = cat.id;
            renderApp();
          });
          bar.appendChild(btn);
        });
      }

      function buildElapsedBadgeHtml(elapsedDays) {
        if (elapsedDays === null) {
          return '<span class="elapsed-badge badge-none">まだ記録なし</span>';
        }
        if (elapsedDays <= 0) {
          return `<span class="elapsed-badge badge-today">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            今日やった！
          </span>`;
        }
        if (elapsedDays === 1) {
          return '<span class="elapsed-badge badge-yesterday">昨日やった</span>';
        }
        return `<span class="elapsed-badge badge-days">前回から${elapsedDays}日目</span>`;
      }

      function renderTaskList() {
        const listEl = document.getElementById('task-list');
        const countEl = document.getElementById('task-count-label');

        const filtered = state.tasks.filter((task) => {
          if (state.activeFilter === 'all') return true;
          return task.categoryId === state.activeFilter;
        });

        filtered.sort((a, b) => {
          if (state.sortBy === 'elapsed_desc') {
            const tA = a.lastDoneAt ? new Date(a.lastDoneAt).getTime() : 0;
            const tB = b.lastDoneAt ? new Date(b.lastDoneAt).getTime() : 0;
            return tA - tB;
          }
          if (state.sortBy === 'recent_desc') {
            const tA = a.lastDoneAt ? new Date(a.lastDoneAt).getTime() : 0;
            const tB = b.lastDoneAt ? new Date(b.lastDoneAt).getTime() : 0;
            return tB - tA;
          }
          return new Date(b.createdAt || 0).getTime() - new Date(a.createdAt || 0).getTime();
        });

        countEl.textContent = `${filtered.length}件の記録`;
        listEl.innerHTML = '';

        if (filtered.length === 0) {
          listEl.innerHTML = `
            <div class="empty-box">
              <p style="font-weight:800; margin:0 0 6px; color:var(--ink);">記録がまだありません</p>
              <p style="font-size:0.82rem; margin:0;">右下の「＋」ボタンから<br>やったことを追加してみましょう</p>
            </div>
          `;
          return;
        }

        filtered.forEach((task) => {
          const cat = state.categories.find((c) => c.id === task.categoryId) || { name: 'その他', color: 'mustard' };
          const elapsedDays = getElapsedDays(task.lastDoneAt);
          const isDoneToday = elapsedDays !== null && elapsedDays <= 0;
          const isJustStamped = state.lastStampedTaskId === task.id;

          const card = document.createElement('div');
          card.className = 'task-card' + (isDoneToday ? ' is-today' : '');

          card.innerHTML = `
            <button type="button" class="check-btn ${isDoneToday ? 'checked' : ''} ${isJustStamped ? 'stamp-anim' : ''}" aria-label="${isDoneToday ? 'チェックを外す' : '今日やったことにする'}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </button>
            <div class="card-content">
              <div class="card-top-row">
                <span class="cat-badge cat-${escapeHtml(cat.color)}">${escapeHtml(cat.name)}</span>
                ${buildElapsedBadgeHtml(elapsedDays)}
              </div>
              <h3 class="card-title">${escapeHtml(task.title)}</h3>
              <div class="card-bottom-row">
                <div class="last-done-text">
                  <span>${formatDateTime(task.lastDoneAt)}</span>
                  <span style="opacity:0.75;">タップで編集</span>
                </div>
                ${task.memo ? `<div class="memo-box">${escapeHtml(task.memo)}</div>` : ''}
              </div>
            </div>
          `;

          const checkBtn = card.querySelector('.check-btn');
          checkBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleTaskDone(task.id);
          });

          const contentArea = card.querySelector('.card-content');
          contentArea.addEventListener('click', () => {
            openTaskModal(task.id);
          });

          listEl.appendChild(card);
        });

        state.lastStampedTaskId = null;
      }

      function renderApp() {
        renderCategoryFilters();
        renderTaskList();
      }

      // --- チェックのON/OFFトグル動作 ---
      function toggleTaskDone(taskId) {
        const task = state.tasks.find((t) => t.id === taskId);
        if (!task) return;

        const elapsedDays = getElapsedDays(task.lastDoneAt);
        const isDoneToday = elapsedDays !== null && elapsedDays <= 0;

        if (!isDoneToday) {
          task.previousDoneAt = task.lastDoneAt || null;
          task.lastDoneAt = new Date().toISOString();
          state.lastStampedTaskId = task.id;
          saveToStorage();
          renderApp();
          showToast('記録しました！');
        } else {
          task.lastDoneAt = task.previousDoneAt !== undefined ? task.previousDoneAt : null;
          task.previousDoneAt = null;
          saveToStorage();
          renderApp();
          showToast('取り消しました');
        }
      }

      // --- トースト通知 ---
      let toastTimer = null;
      function showToast(message) {
        const toastEl = document.getElementById('toast');
        const msgEl = document.getElementById('toast-message');

        msgEl.textContent = message;
        toastEl.classList.add('show');

        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toastEl.classList.remove('show');
        }, 2400);
      }

      // --- モーダル内カテゴリピル描画 ---
      function renderModalCategoryPills() {
        const wrap = document.getElementById('modal-category-pills');
        wrap.innerHTML = '';

        state.categories.forEach((cat) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          const isSelected = state.modalSelectedCategoryId === cat.id;
          btn.className = `cat-choice-pill cat-${cat.color}` + (isSelected ? ' selected' : '');
          btn.textContent = cat.name;
          btn.addEventListener('click', () => {
            state.modalSelectedCategoryId = cat.id;
            renderModalCategoryPills();
          });
          wrap.appendChild(btn);
        });

        const addCatBtn = document.createElement('button');
        addCatBtn.type = 'button';
        addCatBtn.className = 'cat-choice-pill';
        addCatBtn.textContent = '+ 新しいカテゴリ';
        addCatBtn.addEventListener('click', () => {
          document.getElementById('new-cat-panel').classList.toggle('open');
        });
        wrap.appendChild(addCatBtn);
      }

      // --- 追加・編集モーダル開閉 ---
      function openTaskModal(taskId) {
        const modal = document.getElementById('task-modal');
        const modalTitle = document.getElementById('task-modal-title');
        const idInput = document.getElementById('form-task-id');
        const titleInput = document.getElementById('form-title');
        const doneAtInput = document.getElementById('form-done-at');
        const memoInput = document.getElementById('form-memo');
        const deleteBtn = document.getElementById('delete-task-btn');
        const newCatPanel = document.getElementById('new-cat-panel');

        newCatPanel.classList.remove('open');
        document.getElementById('new-cat-name-input').value = '';

        if (taskId) {
          const task = state.tasks.find((t) => t.id === taskId);
          if (!task) return;
          modalTitle.textContent = '記録を編集する';
          idInput.value = task.id;
          titleInput.value = task.title;
          state.modalSelectedCategoryId = task.categoryId || state.categories[0].id;
          doneAtInput.value = task.lastDoneAt ? toDatetimeLocalString(task.lastDoneAt) : '';
          memoInput.value = task.memo || '';
          deleteBtn.style.display = 'inline-flex';
        } else {
          modalTitle.textContent = '新しいやったことを追加';
          idInput.value = '';
          titleInput.value = '';
          state.modalSelectedCategoryId = state.activeFilter !== 'all'
            ? state.activeFilter
            : state.categories[0].id;
          doneAtInput.value = toDatetimeLocalString(new Date().toISOString());
          memoInput.value = '';
          deleteBtn.style.display = 'none';
        }

        renderModalCategoryPills();
        modal.classList.add('open');
      }

      function closeTaskModal() {
        document.getElementById('task-modal').classList.remove('open');
      }

      // --- イベント初期化 ---
      document.addEventListener('DOMContentLoaded', () => {
        renderTodayHeader();
        loadFromStorage();
        renderApp();

        // 並び替え
        document.getElementById('sort-select').addEventListener('change', (e) => {
          state.sortBy = e.target.value;
          renderTaskList();
        });

        // 新規追加ボタン
        document.getElementById('open-add-modal-btn').addEventListener('click', () => {
          openTaskModal(null);
        });

        document.getElementById('close-task-modal-btn').addEventListener('click', closeTaskModal);

        // クイック日時ボタン
        document.getElementById('quick-now-btn').addEventListener('click', () => {
          document.getElementById('form-done-at').value = toDatetimeLocalString(new Date().toISOString());
        });

        document.getElementById('quick-clear-btn').addEventListener('click', () => {
          document.getElementById('form-done-at').value = '';
        });

        // 新規カテゴリ追加
        document.querySelectorAll('#new-cat-colors .color-swatch').forEach((swatch) => {
          swatch.addEventListener('click', () => {
            document.querySelectorAll('#new-cat-colors .color-swatch').forEach((s) => s.classList.remove('selected'));
            swatch.classList.add('selected');
            state.newCatColor = swatch.dataset.color;
          });
        });

        document.getElementById('confirm-add-cat-btn').addEventListener('click', () => {
          const nameInput = document.getElementById('new-cat-name-input');
          const name = nameInput.value.trim();
          if (!name) {
            showToast('カテゴリ名を入力してください');
            return;
          }
          const newCat = {
            id: 'cat_' + Date.now(),
            name: name,
            color: state.newCatColor
          };
          state.categories.push(newCat);
          state.modalSelectedCategoryId = newCat.id;
          saveToStorage();
          renderCategoryFilters();
          renderModalCategoryPills();
          nameInput.value = '';
          document.getElementById('new-cat-panel').classList.remove('open');
          showToast(`カテゴリ「${name}」を追加しました`);
        });

        // 保存処理
        document.getElementById('task-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const id = document.getElementById('form-task-id').value;
          const title = document.getElementById('form-title').value.trim();
          const doneAtVal = document.getElementById('form-done-at').value;
          const memo = document.getElementById('form-memo').value.trim();

          if (!title) return;
          const isoDate = doneAtVal ? new Date(doneAtVal).toISOString() : null;

          if (id) {
            const task = state.tasks.find((t) => t.id === id);
            if (task) {
              if (task.lastDoneAt !== isoDate) {
                task.previousDoneAt = task.lastDoneAt;
              }
              task.title = title;
              task.categoryId = state.modalSelectedCategoryId;
              task.lastDoneAt = isoDate;
              task.memo = memo;
            }
            showToast('記録を更新しました');
          } else {
            state.tasks.unshift({
              id: 'task_' + Date.now(),
              title: title,
              categoryId: state.modalSelectedCategoryId,
              lastDoneAt: isoDate,
              previousDoneAt: null,
              memo: memo,
              createdAt: new Date().toISOString()
            });
            showToast('新しい記録を追加しました');
          }

          saveToStorage();
          renderApp();
          closeTaskModal();
        });

        // 削除処理
        document.getElementById('delete-task-btn').addEventListener('click', () => {
          const id = document.getElementById('form-task-id').value;
          if (!id) return;
          state.tasks = state.tasks.filter((t) => t.id !== id);
          saveToStorage();
          renderApp();
          closeTaskModal();
          showToast('記録を削除しました');
        });

        // バックアップモーダル
        const backupModal = document.getElementById('backup-modal');
        document.getElementById('open-backup-btn').addEventListener('click', () => {
          backupModal.classList.add('open');
        });
        document.getElementById('close-backup-modal-btn').addEventListener('click', () => {
          backupModal.classList.remove('open');
        });

        document.getElementById('export-json-btn').addEventListener('click', () => {
          const jsonStr = JSON.stringify({ categories: state.categories, tasks: state.tasks }, null, 2);
          const blob = new Blob([jsonStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `yattakoto_techo_${new Date().toISOString().slice(0, 10)}.json`;
          link.click();
          URL.revokeObjectURL(url);
          showToast('バックアップを書き出しました');
        });

        document.getElementById('import-json-input').addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              const parsed = JSON.parse(ev.target.result);
              if (Array.isArray(parsed.tasks)) {
                state.categories = Array.isArray(parsed.categories) && parsed.categories.length > 0
                  ? parsed.categories
                  : DEFAULT_CATEGORIES.slice();
                state.tasks = parsed.tasks;
                saveToStorage();
                renderApp();
                backupModal.classList.remove('open');
                showToast('バックアップを復元しました');
              } else {
                showToast('ファイル形式が正しくありません');
              }
            } catch (err) {
              showToast('読み込みに失敗しました');
            }
          };
          reader.readAsText(file);
          e.target.value = '';
        });

        document.getElementById('reset-sample-btn').addEventListener('click', () => {
          state.categories = DEFAULT_CATEGORIES.slice();
          state.tasks = buildInitialSampleTasks();
          state.activeFilter = 'all';
          saveToStorage();
          renderApp();
          backupModal.classList.remove('open');
          showToast('サンプルデータに戻しました');
        });

        // 背景タップでモーダルを閉じる
        [document.getElementById('task-modal'), backupModal].forEach((backdrop) => {
          backdrop.addEventListener('click', (e) => {
            if (e.target === backdrop) {
              backdrop.classList.remove('open');
            }
          });
        });
      });
    })();
  </script>
</body>
</html>
